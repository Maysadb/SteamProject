<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">

    <title>Windy's Bulb | Digital Twin & AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060913;
            --bg-card: rgba(17, 24, 39, 0.65);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(16, 185, 129, 0.45);
            --accent-emerald: #10b981;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden;
            background-image: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.12) 0%, transparent 45%),
                              radial-gradient(circle at 85% 30%, rgba(6, 182, 212, 0.12) 0%, transparent 45%);
            padding-bottom: 90px;
        }
        .tech-grid-bg {
            position: fixed; inset: 0; background-size: 45px 45px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            z-index: -1; mask-image: radial-gradient(ellipse at center, black 40%, transparent 85%);
        }

        /* Cinematic Intro */
        .intro-screen {
            position: fixed; inset: 0; background: #03050a; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 24px; text-align: center; transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .intro-screen.hidden { opacity: 0; transform: scale(1.06); pointer-events: none; }
        .turbine-core-stage { position: relative; width: 210px; height: 210px; display: flex; justify-content: center; align-items: center; margin-bottom: 28px; }
        .orbit-ring { position: absolute; border-radius: 50%; border: 1px solid rgba(16, 185, 129, 0.25); }
        .orbit-1 { width: 205px; height: 205px; border-top: 2px solid var(--accent-cyan); border-bottom: 2px solid transparent; animation: spinCW 8s linear infinite; }
        .orbit-2 { width: 165px; height: 165px; border-left: 2px solid var(--accent-emerald); border-right: 2px solid transparent; animation: spinCCW 5s linear infinite; }
        .orbit-glow { position: absolute; width: 110px; height: 110px; background: radial-gradient(circle, rgba(16, 185, 129, 0.35), transparent 70%); border-radius: 50%; animation: pulseCore 2.5s ease-in-out infinite alternate; }
        .hero-rotor-svg { width: 120px; height: 120px; z-index: 2; animation: spinCW 2.4s linear infinite; filter: drop-shadow(0 0 18px rgba(16, 185, 129, 0.6)); }
        @keyframes spinCW { 100% { transform: rotate(360deg); } }
        @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
        @keyframes pulseCore { 0% { transform: scale(0.85); opacity: 0.6; } 100% { transform: scale(1.25); opacity: 1; } }
        .intro-pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.35); color: var(--accent-emerald); font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; }
        .intro-title { font-size: clamp(32px, 6vw, 48px); font-weight: 800; background: linear-gradient(135deg, #ffffff 20%, #a7f3d0 60%, #22d3ee 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
        .intro-meta { color: var(--text-muted); font-size: 14px; max-width: 440px; line-height: 1.6; margin-bottom: 32px; }
        .intro-meta strong { color: #e2e8f0; }
        .luxury-btn { background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan)); color: #03050a; font-weight: 800; font-size: 15px; padding: 15px 38px; border-radius: 999px; border: none; cursor: pointer; box-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.5); transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .luxury-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 18px 40px -5px rgba(6, 182, 212, 0.65); }

        .top-bar {

            background: rgba(11, 17, 32, 0.78); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass); border-radius: 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .brand-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; color: #fff; text-decoration: none; }
        .brand-icon-box { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(6, 182, 212, 0.25)); border: 1px solid rgba(16, 185, 129, 0.4); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .desktop-nav { display: flex; gap: 6px; background: rgba(255, 255, 255, 0.03); padding: 5px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-tab { text-decoration: none; color: var(--text-muted); padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; transition: all 0.25s ease; }
