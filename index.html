<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Windy's Bulb - Digital Twin & AI System</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #e0f7fa, #e8f5e9, #f1f8e9); margin: 0; padding: 12px; color: #333; overflow-x: hidden; }

        /* ================= PRO KINETIC TURBINE INTRO ================= */
        .pro-intro-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0d2b1d 0%, #050a08 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; color: #fff; text-align: center; padding: 20px;
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s ease;
        }
        .pro-intro-overlay.hidden { opacity: 0; pointer-events: none; transform: scale(1.08); }

        .turbine-stage {
            position: relative; width: 180px; height: 180px;
            display: flex; justify-content: center; align-items: center; margin-bottom: 20px;
        }
        .energy-ring {
            position: absolute; border-radius: 50%; border: 2px dashed rgba(105, 240, 174, 0.4);
            animation: spinReverse 12s linear infinite;
        }
        .ring-outer { width: 175px; height: 175px; border-color: rgba(0, 229, 255, 0.35); }
        .ring-inner { width: 130px; height: 130px; border: 2px solid rgba(105, 240, 174, 0.6); border-top-color: transparent; border-bottom-color: transparent; animation: spinFast 3s linear infinite; }

        .svg-turbine-rotor {
            width: 110px; height: 110px; z-index: 2;
            animation: spinTurbineIntro 2.2s linear infinite;
            filter: drop-shadow(0 0 15px rgba(105, 240, 174, 0.7));
        }
        @keyframes spinTurbineIntro { 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
        @keyframes spinFast { 100% { transform: rotate(360deg); } }

        .intro-badge {
            background: rgba(105, 240, 174, 0.15); border: 1px solid #69f0ae;
            color: #69f0ae; padding: 4px 14px; border-radius: 20px; font-size: 11.5px;
            font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px;
        }
        .intro-main-title {
            font-size: 32px; font-weight: 900; margin: 0 0 8px 0;
            background: linear-gradient(90deg, #ffffff, #69f0ae, #00e5ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .intro-desc { font-size: 14px; color: #b0bec5; max-width: 420px; line-height: 1.5; margin: 0 0 25px 0; }
        .intro-launch-btn {
            background: linear-gradient(135deg, #00c853, #00bfa5); color: #050a08;
            border: none; padding: 14px 34px; font-size: 15px; font-weight: 800;
            border-radius: 50px; cursor: pointer; letter-spacing: 0.5px;
            box-shadow: 0 0 25px rgba(0, 200, 83, 0.5); transition: all 0.3s ease;
        }
        .intro-launch-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 0 35px rgba(0, 229, 255, 0.7); }

        /* ================= RESPONSIVE MOBILE NAVBAR ================= */
        .navbar {
            max-width: 950px; margin: 0 auto 18px auto; background: #ffffff; padding: 12px 18px;
            border-radius: 16px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); position: relative;
        }
        .nav-brand { font-weight: 800; color: #2e7d32; font-size: 19px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-right-group { display: flex; align-items: center; gap: 8px; }
        .nav-links { display: flex; gap: 8px; align-items: center; }
        .nav-links a { text-decoration: none; color: #37474f; font-weight: 700; font-size: 13px; padding: 8px 12px; border-radius: 10px; transition: all 0.2s; }
        .nav-links a:hover, .nav-links a.active { background: #e8f5e9; color: #2e7d32; }
        
        .nav-action-btn {
            background: #f1f8e9; border: 1.5px solid #81c784; color: #2e7d32;
            padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .hamburger-btn {
            display: none; background: #e8f5e9; border: none; color: #2e7d32;
            font-size: 22px; padding: 5px 10px; border-radius: 10px; cursor: pointer;
        }

        @media (max-width: 768px) {
            .hamburger-btn { display: block; }
            .nav-links {
                display: none; flex-direction: column; width: 100%; position: absolute;
                top: 62px; left: 0; background: #ffffff; padding: 12px; border-radius: 16px;
                box-shadow: 0 12px 30px rgba(0,0,0,0.15); z-index: 1000; border: 2px solid #c8e6c9;
            }
            .nav-links.open { display: flex; }
            .nav-links a { width: 100%; text-align: center; padding: 11px; font-size: 14px; }
        }

        /* ================= MAIN CONTAINER & TELEMETRY ================= */
        .container { max-width: 950px; margin: 0 auto; background: #ffffff; padding: 22px; border-radius: 20px; box-shadow: 0 12px 35px rgba(0,0,0,0.1); }
        
        .simulator-box { background: #f8f9fa; border: 2px solid #cfd8dc; border-radius: 16px; padding: 18px; margin-bottom: 22px; }
        .telemetry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .tele-card { background: #ffffff; border: 1.5px solid #b0bec5; border-radius: 12px; padding: 10px; text-align: center; }
        .tele-label { font-size: 11px; font-weight: 700; color: #78909c; text-transform: uppercase; }
        .tele-value { font-size: 18px; font-weight: 800; color: #263238; margin-top: 3px; }

        .slider-box { background: white; border: 2px solid #90caf9; border-radius: 14px; padding: 14px; margin-bottom: 15px; }
        .custom-slider { width: 100%; height: 8px; border-radius: 5px; background: #e0e0e0; outline: none; -webkit-appearance: none; cursor: pointer; }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #1976d2; cursor: pointer; }

        .visual-stage { display: flex; justify-content: space-around; align-items: center; background: white; padding: 15px 8px; border-radius: 12px; border: 1px solid #e0e0e0; gap: 6px; }
        .turbine { font-size: 42px; display: inline-block; }
        .bulb { font-size: 42px; opacity: 0.3; transition: all 0.3s; }
        .bulb-on { opacity: 1; filter: drop-shadow(0 0 14px #fbc02d); transform: scale(1.12); }
        .spin-fast { animation: spinTurbineIntro 0.28s linear infinite; }
        .spin-med { animation: spinTurbineIntro 0.6s linear infinite; }
        .spin-slow { animation: spinTurbineIntro 1.2s linear infinite; }
        .spin-stop { animation: none; }

        .presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-top: 12px; }
        .preset-btn { background: #ffb74d; border: none; padding: 10px 6px; border-radius: 10px; font-weight: bold; color: white; cursor: pointer; font-size: 12px; }
        .preset-btn:hover { background: #ffa726; }
